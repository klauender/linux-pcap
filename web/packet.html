<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パケット - LinaP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <aside class="sidebar">
        <header class="sidebar-header">
            <a href="/index" class="header-title">Lina<span class="status-letter">P</span></a>
            <button class="sidebar-toggle">
                <span class="material-symbols-rounded">chevron_left</span>
            </button>
        </header>

        <div class="sidebar-content">
            <!-- menu list -->
            <ul class="menu-list">
                <li class="menu-item">
                    <a href="/packet" class="menu-link active">
                        <span class="material-symbols-rounded">inventory_2</span>
                        <span class="menu-label">パケット</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/index" class="menu-link">
                        <span class="material-symbols-rounded">swap_horiz</span>
                        <span class="menu-label">フロー</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/realtime" class="menu-link">
                        <span class="material-symbols-rounded">monitoring</span>
                        <span class="menu-label">リアルタイム</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/security" class="menu-link">
                        <span class="material-symbols-rounded">security</span>
                        <span class="menu-label">セキュリティ</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/network" class="menu-link">
                        <span class="material-symbols-rounded">lan</span>
                        <span class="menu-label">ネットワーク</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <!-- ログイン状態表示 -->
        <div id="login-status-footer" class="login-status-footer"></div>
        
        <!-- sidebar-footer -->
        <div class="sidebar-footer">
            <a href="/settings" class="menu-link">
                <span class="material-symbols-rounded">settings</span>
                <span class="menu-label">設定</span>
            </a>
            <a href="/logout" class="menu-link menu-link-logout">
                <span class="material-symbols-rounded">logout</span>
                <span class="menu-label">ログアウト</span>
            </a>
            <button class="theme-toggle">
                <div class="theme-label">
                    <span class="theme-icon material-symbols-rounded">dark_mode</span>
                    <span class="theme-text">Dark Mode</span>
                </div>
                <div class="theme-toggle-track">
                    <div class="theme-toggle-indicator"></div>
                </div>
            </button>
        </div>
    </aside>

    <main>
        <!-- パケットコンテンツをここに追加 -->
    </main>

    <script src="js/sidebar.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
