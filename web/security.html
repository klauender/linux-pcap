<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セキュリティ - LinaP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chart.css">
</head>
<body>
    <aside class="sidebar">
        <header class="sidebar-header">
            <a href="/index" class="header-title">Lina<span class="status-letter">P</span></a>
            <button class="sidebar-toggle">
                <span class="material-symbols-rounded">chevron_left</span>
            </button>
        </header>

        <div class="sidebar-content">
            <!-- menu list -->
            <ul class="menu-list">
                <li class="menu-item">
                    <a href="/index" class="menu-link">
                        <span class="material-symbols-rounded">dashboard</span>
                        <span class="menu-label" data-i18n="dashboard">ダッシュボード</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/packets" class="menu-link">
                        <span class="material-symbols-rounded">inventory_2</span>
                        <span class="menu-label" data-i18n="packets">パケット</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/flows" class="menu-link">
                        <span class="material-symbols-rounded">swap_horiz</span>
                        <span class="menu-label" data-i18n="flows">フロー</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/security" class="menu-link active">
                        <span class="material-symbols-rounded">security</span>
                        <span class="menu-label" data-i18n="security">セキュリティ</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/network" class="menu-link">
                        <span class="material-symbols-rounded">lan</span>
                        <span class="menu-label" data-i18n="network">ネットワーク</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <!-- ログイン状態表示 -->
        <div id="login-status-footer" class="login-status-footer"></div>
        
        <!-- sidebar-footer -->
        <div class="sidebar-footer">
            <a href="/settings" class="menu-link">
                <span class="material-symbols-rounded">settings</span>
                <span class="menu-label" data-i18n="settings">設定</span>
            </a>
            <button class="unit-toggle">
                <div class="unit-label">
                    <span class="unit-icon material-symbols-rounded">scale</span>
                    <span class="unit-text">MB</span>
                </div>
                <div class="unit-toggle-track">
                    <div class="unit-toggle-indicator"></div>
                </div>
            </button>
            <button class="theme-toggle">
                <div class="theme-label">
                    <span class="theme-icon material-symbols-rounded">dark_mode</span>
                    <span class="theme-text">Dark Mode</span>
                </div>
                <div class="theme-toggle-track">
                    <div class="theme-toggle-indicator"></div>
                </div>
            </button>
            <a href="/logout" class="menu-link menu-link-logout">
                <span class="material-symbols-rounded">logout</span>
                <span class="menu-label" data-i18n="logout">ログアウト</span>
            </a>
        </div>
    </aside>

    <main>
        <header class="main-header">
            <div class="time-range-controls">
                <label class="radio-item">
                    <input type="radio" name="time-range" value="10" checked>
                    <span class="radio-label">10min<span class="interval-badge">5sec</span></span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="time-range" value="60">
                    <span class="radio-label">1hour<span class="interval-badge">30sec</span></span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="time-range" value="1440">
                    <span class="radio-label">1day<span class="interval-badge">10min</span></span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="time-range" value="10080">
                    <span class="radio-label">1week<span class="interval-badge">1hour</span></span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="time-range" value="40320">
                    <span class="radio-label">4weeks<span class="interval-badge">6hour</span></span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="time-range" value="525600">
                    <span class="radio-label">1year<span class="interval-badge">1day</span></span>
                </label>
            </div>
        </header>
        <!-- セキュリティコンテンツをここに追加 -->
    </main>

    <script src="js/sidebar.js"></script>
    <script src="js/i18n.js"></script>
</body>
</html>
