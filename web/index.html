<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinaP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/chart.css">
</head>
<body>
    <aside class="sidebar">
        <header class="sidebar-header">
            <h1 class="header-title">LinaP</h1>
            <button class="sidebar-toggle">
                <span class="material-symbols-rounded">chevron_left</span>
            </button>
        </header>

        <div class="sidebar-content">
            <!-- menu list -->
            <ul class="menu-list">
                <li class="menu-item">
                    <a href="/index" class="menu-link active">
                        <span class="material-symbols-rounded">dashboard</span>
                        <span class="menu-label">フロー</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/realtime" class="menu-link">
                        <span class="material-symbols-rounded">monitoring</span>
                        <span class="menu-label">リアルタイム</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <!-- ログイン状態表示 -->
        <div id="login-status-footer" class="login-status-footer"></div>
        
        <!-- sidebar-footer -->
        <div class="sidebar-footer">
            <a href="/settings" class="menu-link">
                <span class="material-symbols-rounded">settings</span>
                <span class="menu-label">設定</span>
            </a>
            <a href="/logout" class="menu-link menu-link-logout">
                <span class="material-symbols-rounded">logout</span>
                <span class="menu-label">ログアウト</span>
            </a>
            <button class="theme-toggle">
                <div class="theme-label">
                    <span class="theme-icon material-symbols-rounded">dark_mode</span>
                    <span class="theme-text">Dark Mode</span>
                </div>
                <div class="theme-toggle-track">
                    <div class="theme-toggle-indicator"></div>
                </div>
            </button>
        </div>
    </aside>

    <main>
        <div class="display-flex byBytes">
            <section class="chart-section-bar">
                <h2 class="chart-title">Top 10 フロー (MB単位)</h2>
                <div class="chart-wrapper-bar">
                    <canvas id="flowsByBytes"></canvas>
                </div>
            </section>

            <section class="chart-section-pie">
                <h2 class="chart-title">通信方向 (MB単位)</h2>
                <div class="chart-wrapper-pie">
                    <canvas id="bytesByDirection"></canvas>
                </div>
            </section>
        </div>

        <div class="display-flex byPackets">
            <section class="chart-section-bar">
                <h2 class="chart-title">Top 10 フロー (パケット単位)</h2>
                <div class="chart-wrapper-bar">
                    <canvas id="flowsByPackets"></canvas>
                </div>
            </section>

            <section class="chart-section-pie">
                <h2 class="chart-title">通信方向 (パケット単位)</h2> <!--Traffic Direction (packets)-->
                <div class="chart-wrapper-pie">
                    <canvas id="packetsByDirection"></canvas>
                </div>
            </section>
        </div>

    </main>

    <!-- パスワード変更モーダル -->
    <div id="password-modal" class="password-modal">
        <div class="password-modal-content">
            <div class="password-modal-header">
                <h2>パスワード変更</h2>
                <button class="password-modal-close" id="password-modal-close-btn">&times;</button>
            </div>
            <form id="password-change-form">
                <div class="form-group">
                    <label for="old-password">現在のパスワード</label>
                    <input type="password" id="old-password" name="oldPassword" required>
                </div>
                <div class="form-group">
                    <label for="new-password">新しいパスワード</label>
                    <input type="password" id="new-password" name="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">新しいパスワード（確認）</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required>
                </div>
                <div id="password-error" class="error-message"></div>
                <div id="password-success" class="success-message"></div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">変更</button>
                    <button type="button" class="cancel-btn" id="password-cancel-btn">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <!-- chart.js読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/index.js"></script>
    <script src="js/password-change.js"></script>
</body>
</html>
